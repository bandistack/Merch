<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merch Oficial</title>
<link rel="icon" type="image/svg+xml" href="logohoodie.svg">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg:#0e0e10; --panel:#16161a; --line:#2e2e34;
    --text:#f2f0eb; --muted:#8d8f96;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f2ee; --panel:#ffffff; --line:#d6d3cc; --text:#18181b; --muted:#6b6d74; }
    .logo { filter: invert(1); }
  }

  * { box-sizing:border-box; border-radius:0; }
  body { margin:0; font-family:system-ui, sans-serif; background:var(--bg); color:var(--text); }

  .wrap { max-width:1100px; margin:0 auto; padding:24px; display:flex; flex-direction:column; gap:16px; }

  header { display:flex; align-items:center; gap:16px; padding:16px 20px;
    background:var(--panel); border:1px solid var(--line); }
  .logo { width:48px; height:48px; flex:none; display:block; }
  .titulos { min-width:0; }
  h1 { margin:0; font-size:1.1rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; }
  p.hint { margin:4px 0 0; color:var(--muted); font-size:.8rem; }

  .tienda { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:stretch; }

  .visor-wrap { background:var(--panel); border:1px solid var(--line); }
  model-viewer { display:block; width:100%; height:100%; min-height:440px; --poster-color:transparent; background:transparent; }

  .ficha { background:var(--panel); border:1px solid var(--line); display:flex; flex-direction:column; min-width:0; }
  .ficha > section { padding:20px; }
  .ficha > section + section { border-top:1px solid var(--line); }
  .ficha [hidden] { display:none; }

  .etiqueta { margin:0 0 8px; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
  #nombre { margin:0; font-size:1.4rem; font-weight:600; line-height:1.2; }
  #precio { margin:0; font-size:2rem; font-weight:700; letter-spacing:-.01em; }

  .descripcion p { margin:0 0 10px; line-height:1.6; font-size:.95rem; }
  .descripcion p:last-child { margin-bottom:0; }

  dl.detalles { margin:0; display:grid; grid-template-columns:auto 1fr; gap:0; font-size:.9rem; }
  dl.detalles dt, dl.detalles dd { margin:0; padding:9px 0; border-bottom:1px solid var(--line); }
  dl.detalles dt:last-of-type, dl.detalles dd:last-of-type { border-bottom:0; }
  dl.detalles dt { color:var(--muted); padding-right:20px; }
  dl.detalles dd { text-align:right; }

  a.comprar { display:block; text-align:center; text-decoration:none; padding:14px;
    background:var(--text); color:var(--bg); border:1px solid var(--text);
    font-size:.8rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase; }
  a.comprar:hover { background:transparent; color:var(--text); }
  a.comprar:focus-visible { outline:2px solid var(--text); outline-offset:3px; }

  nav { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:16px; }
  nav button { text-align:left; padding:16px; background:var(--panel); color:var(--text);
    border:1px solid var(--line); font:inherit; font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  nav button:hover { border-color:var(--text); }
  nav button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  nav button:focus-visible { outline:2px solid var(--text); outline-offset:3px; }

  @media (max-width:800px) {
    .wrap { padding:12px; gap:12px; }
    .tienda { grid-template-columns:1fr; gap:12px; }
    model-viewer { min-height:340px; height:55vh; }
    nav { order:-1; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:12px; }
    .logo { width:40px; height:40px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="logo" src="logohoodie.svg" alt="Logo">
    <div class="titulos">
      <h1>Merch Oficial</h1>
      <p class="hint">Arrastra para girar, usa la rueda o pellizca para acercar.</p>
    </div>
  </header>

  <div class="tienda">
    <div class="visor-wrap">
      <model-viewer id="visor" camera-controls auto-rotate touch-action="pan-y"
        environment-image="neutral"
        exposure="1.6" tone-mapping="neutral"
        shadow-intensity="1.3" shadow-softness="0.9"
        alt="Modelo 3D"></model-viewer>
    </div>

    <aside class="ficha" aria-live="polite">
      <section>
        <p class="etiqueta">Producto</p>
        <h2 id="nombre"></h2>
      </section>
      <section id="bloquePrecio" hidden>
        <p class="etiqueta">Precio</p>
        <p id="precio"></p>
      </section>
      <section id="bloqueDesc" class="descripcion" hidden>
        <p class="etiqueta">Descripción</p>
        <div id="descTexto"></div>
      </section>
      <section id="bloqueDetalles" hidden>
        <p class="etiqueta">Detalles</p>
        <dl id="detalles" class="detalles"></dl>
      </section>
      <section id="bloqueComprar" hidden>
        <a id="comprar" class="comprar" target="_blank" rel="noopener">Comprar</a>
      </section>
    </aside>
  </div>

  <nav id="lista" aria-label="Productos"></nav>

</div>

<script>
  const visor = document.getElementById("visor");
  const lista = document.getElementById("lista");
  const nombre = document.getElementById("nombre");
  const bloquePrecio = document.getElementById("bloquePrecio");
  const precio = document.getElementById("precio");
  const bloqueDesc = document.getElementById("bloqueDesc");
  const descTexto = document.getElementById("descTexto");
  const bloqueDetalles = document.getElementById("bloqueDetalles");
  const detalles = document.getElementById("detalles");
  const bloqueComprar = document.getElementById("bloqueComprar");
  const comprar = document.getElementById("comprar");
  let MODELOS = [];

  function mostrar(m) {
    visor.src = m.archivo;
    visor.alt = m.nombre + " en 3D";
    document.title = m.nombre + " - Merch Oficial";
    lista.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.id === m.id));
    history.replaceState(null, "", "?m=" + encodeURIComponent(m.id));

    nombre.textContent = m.nombre;

    if (m.price !== undefined && m.price !== "") {
      precio.textContent = typeof m.price === "number"
        ? "$" + m.price.toLocaleString("es-CO")
        : m.price;
      bloquePrecio.hidden = false;
    } else {
      bloquePrecio.hidden = true;
    }

    descTexto.replaceChildren();
    const texto = (m.descripcion || "").toString().trim();
    texto.split("\n").filter(Boolean).forEach(linea => {
      const p = document.createElement("p");
      p.textContent = linea;
      descTexto.appendChild(p);
    });
    bloqueDesc.hidden = !texto;

    detalles.replaceChildren();
    const pares = Object.entries(m.detalles || {});
    pares.forEach(([k, v]) => {
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      detalles.append(dt, dd);
    });
    bloqueDetalles.hidden = pares.length === 0;

    if (m.enlace) { comprar.href = m.enlace; bloqueComprar.hidden = false; }
    else { bloqueComprar.hidden = true; }
  }

  fetch("modelos.json")
    .then(r => r.json())
    .then(datos => {
      MODELOS = datos.modelos || [];
      if (!MODELOS.length) throw new Error("Sin productos");
      MODELOS.forEach(m => {
        const b = document.createElement("button");
        b.textContent = m.nombre;
        b.dataset.id = m.id;
        b.onclick = () => mostrar(m);
        lista.appendChild(b);
      });
      const pedido = new URLSearchParams(location.search).get("m");
      mostrar(MODELOS.find(m => m.id === pedido) || MODELOS[0]);
    })
    .catch(() => {
      document.querySelector(".hint").textContent = "No se pudo cargar la lista de productos (modelos.json).";
    });
</script>
</body>
</html>
